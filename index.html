<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xAI Warp Drive - Ultimate Control</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- 全能控制面板 UI --- */
        .control-panel {
            position: fixed;
            bottom: 62px;
            right: 20px;
            width: 70px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            border-radius: 3px;
            padding: 2px;
            z-index: 100;
            color: #d0f0ff;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
            transition: opacity 0.3s ease;
        }

        .control-panel.hidden {
            display: none;
        }

        .panel-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 2px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 4px;
        }

        .control-group {
            margin-bottom: 2px;
        }

        .label-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            font-size: 4px;
            margin-bottom: 0;
            color: #8fbcd4;
            line-height: 1;
        }

        .label-row span:first-child {
            font-size: 3px;
            flex: 1;
        }

        .label-row span:last-child {
            font-size: 4px;
            font-weight: bold;
            color: #00e5ff;
            margin-left: 2px;
        }

        /* 滑动条容器 */
        .slider-container {
            height: 5px;
            display: flex;
            align-items: center;
            margin-top: 0;
            margin-bottom: 0;
        }

        /* 滑动条样式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: transparent;
            margin: 0;
            padding: 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 1px; cursor: pointer;
            background: #555; border-radius: 0.5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 6px; width: 6px; border-radius: 50%;
            background: #00e5ff; cursor: pointer;
            margin-top: -2.5px; box-shadow: 0 0 3px #00e5ff;
        }

        /* 颜色选择区域 */
        .color-section {
            border-top: 1px solid #444;
            padding-top: 2px;
            margin-top: 2px;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            margin-top: 2px;
        }
        .color-checkbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 3px;
        }
        .color-box {
            width: 6px; height: 6px;
            border-radius: 1px;
            border: 1px solid transparent;
            margin-bottom: 0.5px;
            transition: all 0.2s;
        }
        /* 隐藏原生 checkbox */
        .color-checkbox input { display: none; }
        /* 选中状态 */
        .color-checkbox input:checked + .color-box {
            border-color: #fff;
            box-shadow: 0 0 3px currentColor;
            transform: scale(1.1);
        }

        /* 设置齿轮图标 */
        .settings-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 101;
            transition: opacity 0.3s ease, transform 0.2s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .settings-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .settings-icon.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .settings-icon svg {
            width: 18px;
            height: 18px;
            fill: #00e5ff;
        }

    </style>
</head>
<body>

    <div class="control-panel hidden" id="control-panel">
        <div class="panel-title">Engine Control</div>
        
        <div class="control-group">
            <div class="label-row"><span>SPEED (速度)</span><span id="val-speed">7.1x</span></div>
            <div class="slider-container">
                <input type="range" id="in-speed" min="0" max="100" value="50">
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>TRAIL (拖尾长度)</span><span id="val-trail">1.5x</span></div>
            <div class="slider-container">
                <input type="range" id="in-trail" min="1" max="30" value="15">
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>SIZE (颗粒大小)</span><span id="val-size">1.5x</span></div>
            <div class="slider-container">
                <input type="range" id="in-size" min="1" max="30" value="15">
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>DENSITY (密度)</span><span id="val-density">1750</span></div>
            <div class="slider-container">
                <input type="range" id="in-density" min="500" max="3000" value="1750" step="100">
            </div>
        </div>

        <div class="color-section">
            <div class="label-row"><span>COLORS (颜色组合)</span></div>
            <div class="color-grid" id="color-grid">
                </div>
        </div>
    </div>

    <div class="settings-icon" id="settings-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        let hasInitializedMouse = false;
        let hideSettingsTimer = null;
        let isPanelVisible = false;
        let lastMouseMoveTime = Date.now();

        const FOCAL_LENGTH = 800;

        // --- 全局设置对象 (由 UI 控制) ---
        const settings = {
            speedMultiplier: 7.1, // 基础速度系数 (中间值)
            trailScale: 1.5,      // 拖尾长度系数 (中间值)
            sizeScale: 1.5,       // 颗粒大小系数 (中间值)
            particleCount: 1750,  // 目标颗粒数量 (中间值)
            activeColors: []      // 当前激活的颜色数组
        };

        // --- 颜色定义 ---
        const COLOR_PALETTE = {
            red:    { rgb: {r: 255, g: 50,  b: 50},  hex: '#ff3232', label: '红' },
            orange: { rgb: {r: 255, g: 150, b: 0},   hex: '#ff9600', label: '橙' },
            yellow: { rgb: {r: 255, g: 255, b: 50},  hex: '#ffff32', label: '黄' },
            green:  { rgb: {r: 50,  g: 255, b: 50},  hex: '#32ff32', label: '绿' },
            cyan:   { rgb: {r: 50,  g: 200, b: 255}, hex: '#32c8ff', label: '青', checked: true },
            blue:   { rgb: {r: 50,  g: 100, b: 255}, hex: '#3264ff', label: '蓝', checked: true },
            purple: { rgb: {r: 150, g: 50,  b: 255}, hex: '#9632ff', label: '紫' },
            white:  { rgb: {r: 220, g: 220, b: 220}, hex: '#ffffff', label: '白', checked: true }
        };
        // 始终包含一个基础背景灰，不参与 UI 选择
        const BASE_GRAY = {r: 100, g: 100, b: 100, type: 'bg'};

        // --- UI 初始化与事件绑定 ---
        function initUI() {
            // 1. 绑定滑动条
            bindInput('in-speed', 'val-speed', val => {
                // 非线性映射：低速区更细腻
                if (val < 30) settings.speedMultiplier = val / 30 * 2; // 0 ~ 2
                else settings.speedMultiplier = 2 + (val - 30) / 70 * 18; // 2 ~ 20
                return settings.speedMultiplier.toFixed(1) + 'x';
            });
            bindInput('in-trail', 'val-trail', val => {
                settings.trailScale = val / 10; // 0.1 ~ 3.0
                return settings.trailScale.toFixed(1) + 'x';
            });
            bindInput('in-size', 'val-size', val => {
                settings.sizeScale = val / 10; // 0.1 ~ 3.0
                return settings.sizeScale.toFixed(1) + 'x';
            });
            bindInput('in-density', 'val-density', val => {
                settings.particleCount = parseInt(val);
                return val;
            });

            // 2. 生成颜色选择器
            const grid = document.getElementById('color-grid');
            for (const key in COLOR_PALETTE) {
                const col = COLOR_PALETTE[key];
                const label = document.createElement('label');
                label.className = 'color-checkbox';
                label.style.color = col.hex;
                label.innerHTML = `
                    <input type="checkbox" value="${key}" ${col.checked ? 'checked' : ''}>
                    <div class="color-box" style="background:${col.hex};"></div>
                    <span>${col.label}</span>
                `;
                grid.appendChild(label);
                
                // 绑定点击事件
                label.querySelector('input').addEventListener('change', updateActiveColors);
            }
            updateActiveColors(); // 初始化颜色数组
        }

        function bindInput(id, valId, mapper) {
            const input = document.getElementById(id);
            const display = document.getElementById(valId);
            input.addEventListener('input', e => {
                display.innerText = mapper(e.target.value);
            });
            // Trigger once to init defaults
            display.innerText = mapper(input.value);
        }

        function updateActiveColors() {
            settings.activeColors = [];
            document.querySelectorAll('.color-checkbox input:checked').forEach(chk => {
                settings.activeColors.push({ ...COLOR_PALETTE[chk.value].rgb, type: 'highlight' });
            });
            // 如果用户取消了所有颜色，默认给一个白色，防止出错
            if (settings.activeColors.length === 0) {
                 settings.activeColors.push({ ...COLOR_PALETTE.white.rgb, type: 'highlight' });
            }
        }


        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            if (!hasInitializedMouse) {
                mouseX = centerX; mouseY = centerY; targetX = centerX; targetY = centerY;
                hasInitializedMouse = true;
            }
        }

        class Star {
            constructor() { this.reset(true); }

            reset(initial = false) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.sqrt(Math.random()) * width * 1.5;
                this.x = Math.cos(angle) * radius;
                this.y = Math.sin(angle) * radius;
                this.z = initial ? Math.random() * 5000 : 5000;
                
                // 颜色选择逻辑：30%概率是背景灰，70%概率从激活的颜色中随机选
                if (Math.random() < 0.3) {
                    this.colorCfg = BASE_GRAY;
                } else {
                    this.colorCfg = settings.activeColors[Math.floor(Math.random() * settings.activeColors.length)];
                }
            }

            update(speed) {
                this.z -= speed;
                // 确保飞到眼前才重置
                if (this.z <= 1) this.reset();
            }

            draw(speed) {
                if (this.z <= 0) return;

                // 使用动态的拖尾长度
                const currentTrailLen = Math.max(0.1, speed * settings.trailScale);

                const scaleHead = FOCAL_LENGTH / this.z;
                const scaleTail = FOCAL_LENGTH / (this.z + currentTrailLen);

                const cx = centerX + (mouseX - centerX) * 0.05;
                const cy = centerY + (mouseY - centerY) * 0.05;

                const xHead = cx + this.x * scaleHead;
                const yHead = cy + this.y * scaleHead;
                const xTail = cx + this.x * scaleTail;
                const yTail = cy + this.y * scaleTail;

                if (xHead < -50 || xHead > width + 50 || yHead < -50 || yHead > height + 50) return;

                const dx = xHead - xTail;
                const dy = yHead - yTail;
                const lineLen = Math.sqrt(dx*dx + dy*dy);

                // 透明度计算
                let alpha = (1 - (this.z / 6000));
                alpha = Math.max(0.1, alpha); // 最低可见度
                if (this.colorCfg.type === 'bg') alpha *= 0.5;

                ctx.fillStyle = `rgba(${this.colorCfg.r}, ${this.colorCfg.g}, ${this.colorCfg.b}, ${alpha})`;
                ctx.strokeStyle = `rgba(${this.colorCfg.r}, ${this.colorCfg.g}, ${this.colorCfg.b}, ${alpha})`;

                // --- 绘制逻辑 (圆形 + 动态大小) ---
                // 基础大小乘以全局缩放系数
                let baseSize = (this.colorCfg.type === 'highlight') ? 2.5 : 1.5;
                baseSize *= settings.sizeScale; 

                if (lineLen < 3 * settings.sizeScale) { 
                    // [画圆点]
                    // 随距离稍微变大
                    const size = baseSize * (scaleHead * 0.4 + 0.6);
                    ctx.beginPath();
                    // 使用 arc 画圆
                    ctx.arc(xHead, yHead, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // [画线段]
                    ctx.beginPath();
                    ctx.moveTo(xTail, yTail);
                    ctx.lineTo(xHead, yHead);
                    
                    let lw = Math.min(5 * settings.sizeScale, scaleHead * 2 * settings.sizeScale);
                    if (this.colorCfg.type === 'bg') lw *= 0.6;
                    
                    ctx.lineWidth = lw;
                    ctx.lineCap = 'round'; // 圆头线段
                    ctx.stroke();

                    // 头部高亮圆点
                    if (this.colorCfg.type === 'highlight') {
                        const headSize = Math.min(8 * settings.sizeScale, scaleHead * 4 * settings.sizeScale);
                        ctx.beginPath();
                        ctx.arc(xHead, yHead, headSize / 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        // 设置图标显示/隐藏逻辑
        function showSettingsIcon() {
            const icon = document.getElementById('settings-icon');
            icon.classList.remove('hidden');
            resetHideTimer();
        }

        function hideSettingsIcon() {
            const icon = document.getElementById('settings-icon');
            icon.classList.add('hidden');
        }

        function resetHideTimer() {
            if (hideSettingsTimer) {
                clearTimeout(hideSettingsTimer);
            }
            lastMouseMoveTime = Date.now();
            hideSettingsTimer = setTimeout(() => {
                const now = Date.now();
                if (now - lastMouseMoveTime >= 5000 && !isPanelVisible) {
                    hideSettingsIcon();
                }
            }, 5000);
        }

        function togglePanel() {
            const panel = document.getElementById('control-panel');
            isPanelVisible = !isPanelVisible;
            if (isPanelVisible) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        // 启动
        initUI();
        resize();
        window.addEventListener('resize', resize);
        
        // 鼠标移动事件
        function handleMouseMove(e) {
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            if (clientX && clientY) {
                targetX = clientX; targetY = clientY;
                if (!hasInitializedMouse) { mouseX = targetX; mouseY = targetY; hasInitializedMouse = true; }
                showSettingsIcon();
            }
        }

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('touchmove', handleMouseMove);

        // 设置图标点击事件
        document.getElementById('settings-icon').addEventListener('click', togglePanel);
        document.getElementById('settings-icon').addEventListener('touchend', (e) => {
            e.preventDefault();
            togglePanel();
        });

        // 初始化：显示设置图标
        showSettingsIcon();

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 1)'; 
            ctx.fillRect(0, 0, width, height);
            
            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            // --- 动态密度控制 ---
            // 如果当前数量少于设定值，添加
            while (stars.length < settings.particleCount) {
                stars.push(new Star());
            }
            // 如果当前数量多于设定值，移除 (从尾部移除性能较好)
            while (stars.length > settings.particleCount) {
                stars.pop();
            }

            // 计算当前速度 (基础速度 * 系数)
            const currentSpeed = 10 * settings.speedMultiplier;

            stars.forEach(star => {
                star.update(currentSpeed);
                star.draw(currentSpeed);
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
